name: Collect sourced family characteristics
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Aantal nog niet onderzochte families per run'
        required: true
        default: '1000'
      delay_seconds:
        description: 'Pauze tussen Wikipedia-verzoeken'
        required: true
        default: '1.0'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect only sourced candidate characteristics
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: python -u build_features.py --limit "$BATCH_SIZE" --delay "$DELAY_SECONDS"
      - name: Verify SQLite
        run: python -c "import sqlite3; c=sqlite3.connect('families.sqlite3'); print(c.execute('PRAGMA integrity_check').fetchone()); print(c.execute('SELECT COUNT(*) FROM families WHERE species_count IS NULL').fetchone())"
      - name: Downloadable database checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: families-with-feature-candidates
          path: families.sqlite3
          retention-days: 30
