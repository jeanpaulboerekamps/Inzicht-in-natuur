name: Improve family facts (pilot, no AI)
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of pilot families
        default: '20'
        required: true
jobs:
  improve-facts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Review and supplement pilot facts
        env:
          LIMIT: ${{ inputs.limit }}
        run: python improve_family_facts.py --limit "$LIMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: family-facts-v21
          path: families.sqlite3
          retention-days: 30
