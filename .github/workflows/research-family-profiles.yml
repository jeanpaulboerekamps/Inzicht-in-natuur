name: Research family encyclopedia profiles
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of families (existing 20-family pilot)'
        default: '20'
        required: true
      retry:
        description: 'Recheck families already processed in v17'
        type: boolean
        default: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect multi-source evidence
        env:
          LIMIT: ${{ inputs.limit }}
          RETRY: ${{ inputs.retry }}
        run: |
          ARGS=""
          if [ "$RETRY" = "true" ]; then ARGS="--retry"; fi
          python -u research_family_profiles.py --limit "$LIMIT" --delay 1.5 $ARGS
      - name: Upload database checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-encyclopedia-research-v17
          path: families.sqlite3
          retention-days: 30
